name: Release gates
on:
  pull_request:
  push:
    branches: [main, v1]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://postgres:ci-only-password@localhost:5432/postgres?sslmode=disable
      DATABASE_URL_TEST: postgres://postgres:ci-only-password@localhost:5432/legacy_test?sslmode=disable
      BUYWISE_IDENTITY_TEST_DSN: postgres://postgres:ci-only-password@localhost:5432/postgres?sslmode=disable
      BUYWISE_SERPAPI_TEST_DSN: postgres://postgres:ci-only-password@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - name: Formatting for changed Go files
        working-directory: .
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=$(git hash-object -t tree /dev/null); fi
          files=$(git diff --name-only -z --diff-filter=ACM "$BASE" HEAD -- 'backend/*.go' | xargs -0 -r gofmt -l)
          test -z "$files" || { printf '%s\n' "$files"; exit 1; }
      - run: go vet ./...
      - name: Create a separate database for legacy store fixtures
        run: docker exec '${{ job.services.postgres.id }}' psql -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE legacy_test'
      - name: Clean PostgreSQL migrations and replay
        run: |
          go run ./cmd/migrate
          go run ./cmd/migrate
      - run: go test -p 1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec eslint .
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix mobile
      - run: pnpm build:mobile
      - run: npm run sync --prefix mobile
      - working-directory: frontend/mobile/android
        run: bash ./gradlew --no-daemon assembleDebug

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          docker run --rm --volume "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            zricethezav/gitleaks:v8.24.3 git --redact /repo

  containers:
    runs-on: ubuntu-latest
    env:
      BUYWISE_DOMAIN: staging.example.test
      POSTGRES_PASSWORD: ci-only-password
      BUYWISE_RUNTIME_PASSWORD: ci-runtime-only-password
      MIGRATION_DATABASE_URL: postgres://buywise:ci-only-password@postgres:5432/buywise?sslmode=disable
      DATABASE_URL: postgres://buywise_runtime:ci-runtime-only-password@postgres:5432/buywise?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose.yaml build migrate web
      - run: docker compose -f deploy/compose.yaml up --wait --wait-timeout 120 web
      - run: docker compose -f deploy/compose.yaml exec -T web wget -qO- http://localhost:3000/health
      - name: Verify the runtime database role via the mobile gateway
        run: |
          docker compose -f deploy/compose.yaml exec -T web node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const registration = await fetch('http://api:8080/auth/register', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({email: 'ci@example.test', password: 'ci-only-test-account'})
          });
          assert.equal(registration.status, 200);
          const {token} = await registration.json();
          const accounts = await fetch('http://localhost:3000/api/mobile/accounts', {
            headers: { Authorization: 'Bearer ' + token }
          });
          assert.equal(accounts.status, 200);
          JS
      - if: failure()
        run: docker compose -f deploy/compose.yaml logs
      - if: always()
        run: docker compose -f deploy/compose.yaml down -v
