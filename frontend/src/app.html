<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="BuyWise — Plan smarter. Buy wiser. Personal finance and purchase planning web application."
		/>
		<title>BuyWise — Plan smarter. Buy wiser.</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;family=Inconsolata:wght@400..700&amp;display=swap"
			rel="stylesheet"
		/>
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('buywise-theme');
					var prefersDark =
						window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
					var theme =
						stored === 'dark' || stored === 'light' ? stored : prefersDark ? 'dark' : 'light';
					document.documentElement.setAttribute('data-theme', theme);
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
